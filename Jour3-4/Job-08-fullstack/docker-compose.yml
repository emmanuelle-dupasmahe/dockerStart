version: '3.8'

services:
  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # Vérifie que MySQL accepte réellement les requêtes
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "${BACKEND_PORT}:3000"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: 3000
    volumes:
      - ./backend:/app
      - /app/node_modules # Exclut le node_modules local
    command: sh -c "npm install && npx nodemon -L server.js"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "${FRONTEND_PORT}:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true" # Requis pour le Hot Reload sous Windows/WSL
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # On ajoute --host pour exposer Vite hors du conteneur
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

volumes:
  db_data: