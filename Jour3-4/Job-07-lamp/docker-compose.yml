version: '3.8'

services:
  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: lamp_demo
      MYSQL_USER: dev
      MYSQL_PASSWORD: devpassword
    volumes:
      - db_data:/var/lib/mysql

  php:
    build: .
    restart: always
    ports:
      - "8081:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db

volumes:
  db_data: